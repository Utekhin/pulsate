<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wave Circle Sound Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #controls {
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #2a2a2a;
            width: 100%;
            justify-content: center;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        button.secondary {
            background: #666;
        }
        button.secondary:hover {
            background: #555;
        }
        .toggle-group {
            display: flex;
            gap: 5px;
        }
        .toggle-group button {
            padding: 8px 12px;
        }
        .toggle-group button.active {
            background: #4CAF50;
        }
        .toggle-group button:not(.active) {
            background: #444;
        }
        label {
            color: #ccc;
            font-size: 14px;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="clearBtn">Clear (Space)</button>
        <label>Audio Mode:</label>
        <div class="toggle-group">
            <button id="synthBtn" class="active">Synth</button>
            <button id="samplesBtn">Samples</button>
        </div>
        <button id="speedBtn" class="secondary">Speed: 1.0x</button>
    </div>
    
    <script src="audioSystem.js"></script>
    <script src="circle.js"></script>
    <script src="main.js"></script>
</body>
</html>
