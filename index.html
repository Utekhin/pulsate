<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsating Circles</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <!-- session.js is now a module -->
    <script type="module" src="session.js"></script>
    <style>
        body {
            margin: 0;
            padding-top: 40px; /* Consistent with canvas positioning */
            font-family: sans-serif; /* Added for better default font */
        }
        canvas {
            display: block;
        }
        .controls {
            position: fixed;
            top: 40px;        /*Consistent with canvas positioning */
            left: calc(50% + 410px); /* Centers controls to the right of canvas */
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            z-index: 1000;
        }
        select, button {
            padding: 5px;
            font-size: 14px;
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-label {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <script type="module">
        import { audioPlayer } from './audio.js';  // Make sure audio.js exists and exports correctly
        window.audioPlayer = audioPlayer; // Make audioPlayer globally accessible.
    </script>

    <script type="module">
        import initializeUserSession from './session.js';

        let circles = [];
        window.circles = circles; // Make circles globally accessible.
        let spatialGrid;
        let growthSpeed = 1;
        const MAX_CIRCLES = 10;
        const MAX_NESTING_LEVEL = 3;
        const CELL_SIZE = 100;
        let clearButton, modeSelect, applyButton, rateSlider;
        let currentMode = 'chromatic';
        let pulsationRate = 1.0;

        const MODES = {
            chromatic: Array.from({length: 44}, (_, i) => i + 1),
            ionian: [1, 3, 5, 6, 8, 10, 12, 13, 15, 17, 18, 20, 22, 24, 25, 27, 29, 30, 32, 34, 36, 37, 39, 41, 42, 44],
            dorian: [1, 3, 4, 6, 8, 10, 11, 13, 15, 16, 18, 20, 22, 23, 25, 27, 28, 30, 32, 34, 35, 37, 39, 41, 42],
            phrygian: [1, 2, 4, 6, 8, 9, 11, 13, 14, 16, 18, 20, 21, 23, 25, 26, 28, 30, 32, 33, 35, 37, 38, 40, 42],
            lydian: [1, 3, 5, 7, 8, 10, 12, 13, 15, 17, 19, 20, 22, 24, 25, 27, 29, 31, 32, 34, 36, 37, 39, 41, 43],
            mixolydian: [1, 3, 5, 6, 8, 10, 11, 13, 15, 17, 18, 20, 22, 23, 25, 27, 29, 30, 32, 34, 35, 37, 39, 41, 42],
            aeolian: [1, 3, 4, 6, 8, 9, 11, 13, 15, 16, 18, 20, 21, 23, 25, 27, 28, 30, 32, 33, 35, 37, 39, 40, 42],
            locrian: [1, 2, 4, 6, 7, 9, 11, 13, 14, 16, 18, 19, 21, 23, 25, 26, 28, 30, 31, 33, 35, 37, 38, 40, 42],
            pentatonic: [1, 3, 5, 8, 10, 13, 15, 17, 20, 22, 25, 27, 29, 32, 34, 37, 39, 41, 44]
        };

        // Function to clear the field (now a regular function)
        function clearField() {
            circles.length = 0; // Efficiently clears the array
            if (window.audioPlayer) {
                window.audioPlayer.stopAllSources();
            }
              if (window.sessionManager) {
                window.sessionManager.updateSessionStats(circles);
             }
        }
        
        //Function to use when mouse is pressed
function mousePressed() {
    // Check if click is on any control element
    let isOverControl = false;
    let dragStartX = mouseX;  // Store the initial mouse X position
    let dragStartY = mouseY;  // Store the initial mouse Y position

    if (clearButton && clearButton.elt) {
        const buttonRect = clearButton.elt.getBoundingClientRect();
        isOverControl = isOverControl || (dragStartX >= buttonRect.left && dragStartX <= buttonRect.right &&
                       dragStartY >= buttonRect.top && dragStartY <= buttonRect.bottom);
    }

    if (applyButton && applyButton.elt) {
        const buttonRect = applyButton.elt.getBoundingClientRect();
        isOverControl = isOverControl || (dragStartX >= buttonRect.left && dragStartX <= buttonRect.right &&
                       dragStartY >= buttonRect.top && dragStartY <= buttonRect.bottom);
    }

    if (modeSelect && modeSelect.elt) {
        const buttonRect = modeSelect.elt.getBoundingClientRect();
        isOverControl = isOverControl || (dragStartX >= buttonRect.left && dragStartX <= buttonRect.right &&
                       dragStartY >= buttonRect.top && dragStartY <= buttonRect.bottom);
    }

    if (rateSlider && rateSlider.elt) {
        const sliderRect = rateSlider.elt.getBoundingClientRect();
        isOverControl = isOverControl || (dragStartX >= sliderRect.left && dragStartX <= sliderRect.right &&
                       dragStartY >= sliderRect.top && dragStartY <= sliderRect.bottom);
    }

    // Check if the click started within the canvas bounds AND is not over a control
    if (!isOverControl && dragStartX >= 0 && dragStartX <= width && dragStartY >= 40 && dragStartY <= height + 40) {  // Consider canvas position
        if (circles.length < MAX_CIRCLES) { // Added max circle check
            let parentCircle = null;
            for (let i = circles.length - 1; i >= 0; i--) {
                let otherCircle = circles[i];
                if (otherCircle.nestingLevel < MAX_NESTING_LEVEL &&
                    dist(dragStartX, dragStartY, otherCircle.centerX, otherCircle.centerY) <= otherCircle.currentRadius) {
                    parentCircle = otherCircle;
                    break;
                }
            }

            const newCircle = new WaveCircle(dragStartX, dragStartY, growthSpeed, parentCircle); // Use initial position
            if (parentCircle) {
                parentCircle.children.push(newCircle);
            }
            circles.push(newCircle);
            if (window.sessionManager) {
                window.sessionManager.updateSessionStats(circles);
            }
        }

    }

}

        function setup() {
            let cnv = createCanvas(800, 800);
            cnv.position(0, 40);  //Consistent with body style.
            spatialGrid = new SpatialGrid(width, height, CELL_SIZE);

            let controlsDiv = createDiv();
            controlsDiv.class('controls');
            controlsDiv.parent(document.body);

            // Mode selection dropdown
            modeSelect = createSelect();
            modeSelect.parent(controlsDiv);
            Object.keys(MODES).forEach(mode => modeSelect.option(mode));
            modeSelect.value(currentMode);

            // Apply button
            applyButton = createButton('Apply Mode');
            applyButton.parent(controlsDiv);
            applyButton.mousePressed(applyMode);

            // Clear button
            clearButton = createButton('Clear');
            clearButton.parent(controlsDiv);
            clearButton.mousePressed(clearField);

            // Pulsation rate slider
            let sliderContainer = createDiv();
            sliderContainer.class('slider-container');
            sliderContainer.parent(controlsDiv);

            let sliderLabel = createDiv('Pulsation Rate');
            sliderLabel.class('slider-label');
            sliderLabel.parent(sliderContainer);

            rateSlider = createSlider(0.1, 2.0, 1.0, 0.1);
            rateSlider.parent(sliderContainer);
            rateSlider.input(updatePulsationRate);

             // Initialize session manager and store it globally
            window.sessionManager = initializeUserSession();
             //Update session stats on initial setup
             if (window.sessionManager) {
               window.sessionManager.updateSessionStats(circles);
             }

        }

        function updatePulsationRate() {
            pulsationRate = rateSlider.value();
            circles.forEach(circle => circle.setPulsationRate(pulsationRate));
        }

        function applyMode() {
            currentMode = modeSelect.value();
            clearField();
        }

        class SpatialGrid {
            constructor(width, height, cellSize) {
                this.cellSize = cellSize;
                this.cols = Math.ceil(width / cellSize);
                this.rows = Math.ceil(height / cellSize);
                this.grid = new Array(this.cols * this.rows).fill().map(() => []);
            }

            clear() {
                for (let i = 0; i < this.grid.length; i++) {
                    this.grid[i].length = 0;
                }
            }

            getCell(x, y) {
                const col = Math.floor(x / this.cellSize);
                const row = Math.floor(y / this.cellSize);
                if (col >= 0 && col < this.cols && row >= 0 && row < this.rows) {
                    return this.grid[row * this.cols + col];
                }
                return null;
            }

            insert(circle) {
                const radius = circle.currentRadius;
                const left = Math.max(0, Math.floor((circle.centerX - radius) / this.cellSize));
                const right = Math.min(this.cols - 1, Math.floor((circle.centerX + radius) / this.cellSize));
                const top = Math.max(0, Math.floor((circle.centerY - radius) / this.cellSize));
                const bottom = Math.min(this.rows - 1, Math.floor((circle.centerY + radius) / this.cellSize));

                for (let row = top; row <= bottom; row++) {
                    for (let col = left; col <= right; col++) {
                        this.grid[row * this.cols + col].push(circle);
                    }
                }
            }

            getPotentialCollisions(circle) {
                const radius = circle.currentRadius;
                const left = Math.max(0, Math.floor((circle.centerX - radius) / this.cellSize));
                const right = Math.min(this.cols - 1, Math.floor((circle.centerX + radius) / this.cellSize));
                const top = Math.max(0, Math.floor((circle.centerY - radius) / this.cellSize));
                const bottom = Math.min(this.rows - 1, Math.floor((circle.centerY + radius) / this.cellSize));

                const nearbyCircles = new Set();

                for (let row = top; row <= bottom; row++) {
                    for (let col = left; col <= right; col++) {
                        const cell = this.grid[row * this.cols + col];
                        cell.forEach(other => {
                            if (other !== circle) {
                                nearbyCircles.add(other);
                            }
                        });
                    }
                }

                return Array.from(nearbyCircles);
            }
        }

        class WaveCircle {
            constructor(x, y, growthSpeed = 1, parent = null) {
                this.centerX = x;
                this.centerY = y;
                this.currentRadius = 0;
                this.growthRate = growthSpeed;
                this.direction = 1;
                this.color = color(0, 0, 139, 150);
                this.parent = parent;
                this.children = [];
                this.nestingLevel = parent ? parent.nestingLevel + 1 : 0;
                this.lastCollisionTime = 0;
                this.collisionCooldown = 10;
                this.pulsationRate = pulsationRate;
            }

            setPulsationRate(rate) {
                this.pulsationRate = rate;
            }

            update() {
                const deltaTime = 1 / frameRate();

                if (this.direction === 1) {
                    this.currentRadius += this.growthRate * deltaTime * 60 * this.pulsationRate;
                } else {
                    this.currentRadius = max(this.currentRadius - this.growthRate * deltaTime * 60 * this.pulsationRate, 0);
                    if (this.currentRadius <= 0) {
                        this.direction = 1;
                    }
                }

                if (this.parent) {
                    let maxRadius = abs(this.parent.currentRadius - dist(this.centerX, this.centerY, this.parent.centerX, this.parent.centerY));
                    if (this.currentRadius >= maxRadius) {
                        this.direction = -1;
                    }
                }
            }

            display() {
                noFill();
                stroke(this.color);
                strokeWeight(2);
                ellipse(this.centerX, this.centerY, this.currentRadius * 2, this.currentRadius * 2);
            }

            checkCollision(other) {
                if (frameCount - this.lastCollisionTime < this.collisionCooldown) {
                    return false;
                }

                const distance = dist(this.centerX, this.centerY, other.centerX, other.centerY);

                if (this.parent === other || other.parent === this) {
                    const collisionDistance = abs(this.currentRadius - other.currentRadius);
                    if (abs(distance - collisionDistance) < 1) {
                        this.handleCollisionResponse(other, distance);
                        return true;
                    }
                    return false;
                }

                const sumRadii = this.currentRadius + other.currentRadius;
                if (distance <= sumRadii && distance > 0) {
                    this.handleCollisionResponse(other, distance);
                    return true;
                }
                return false;
            }

            handleCollisionResponse(other, distance) {
                this.direction *= -1;
                other.direction *= -1;
                this.lastCollisionTime = frameCount;
                other.lastCollisionTime = frameCount;

                const angle = atan2(other.centerY - this.centerY, other.centerX - this.centerX);
                const collisionX = this.centerX + this.currentRadius * cos(angle);
                const collisionY = this.centerY + this.currentRadius * sin(angle);

                if (window.audioPlayer && window.audioPlayer.isReady()) {
                    const sampleIndex1 = this.radiusToSampleIndex(this.currentRadius);
                    const sampleIndex2 = this.radiusToSampleIndex(other.currentRadius);

                    window.audioPlayer.playSample(sampleIndex1, collisionX, width);
                    window.audioPlayer.playSample(sampleIndex2, collisionX, width);
                }
            }

             radiusToSampleIndex(radius) {
                const minRadius = 0;
                const maxRadius = 300;
                const normalized = (radius - minRadius) / (maxRadius - minRadius);
                const modeIndices = MODES[currentMode];
                const index = Math.floor(normalized * (modeIndices.length - 1));
                return modeIndices[Math.max(0, Math.min(index, modeIndices.length - 1))];
            }
        }



        function draw() {
            background(220);

            spatialGrid.clear();
            circles.forEach(circle => spatialGrid.insert(circle));

            circles.forEach(circle => {
                circle.update();
                circle.display();
            });

            circles.forEach(circle => {
                const potentialCollisions = spatialGrid.getPotentialCollisions(circle);
                potentialCollisions.forEach(other => {
                    circle.checkCollision(other);
                });
            });
        }

        // Make functions globally available
        window.setup = setup;
        window.draw = draw;
        window.mousePressed = mousePressed; //Keep a global reference
        // The clearField function doesn't need to be explicitly exposed, it's called directly

    </script>
</body>
</html>
